<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Post | Dora</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400&display=swap');

    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: #fff8f4;
      color: #332225;
      line-height: 1.9;
    }

    .container {
      width: min(900px, calc(100% - 40px));
      margin: auto;
      padding: 60px 0;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 40px;
      font-size: 14px;
      color: #7d6569;
      text-decoration: none;
    }

    .post-date {
      color: #7d6569;
      font-size: 14px;
      margin-bottom: 14px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(42px, 6vw, 74px);
      line-height: 1.05;
      margin-bottom: 28px;
    }

    .hero-image {
      width: 100%;
      max-height: 620px;
      object-fit: cover;
      margin-bottom: 44px;
      border-radius: 4px;
    }

    .excerpt {
      font-size: 20px;
      color: #7d6569;
      margin-bottom: 42px;
    }

    .content {
      font-size: 18px;
    }

    .content img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 32px auto;
      border-radius: 4px;
    }

    .content p {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="blog.html" class="back-link">← Back to Blog</a>

    <div id="post"></div>
  </div>

  <script>
  const repo = "Dora0-cmd/dora-portfolio";

  function parsePost(markdown) {
    const match = markdown.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
    const data = {};
    let body = markdown;

    if (match) {
      body = match[2];
      match[1].split("\n").forEach(line => {
        const [key, ...rest] = line.split(":");
        if (key && rest.length) {
          data[key.trim()] = rest.join(":").trim().replace(/^["']|["']$/g, "");
        }
      });
    }

    return { data, body };
  }

  function markdownToHtml(markdown) {
    return markdown
      .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1">')
      .replace(/^### (.*$)/gim, '<h3>$1</h3>')
      .replace(/^## (.*$)/gim, '<h2>$1</h2>')
      .replace(/^# (.*$)/gim, '<h1>$1</h1>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .split(/\n\s*\n/)
      .map(block => block.startsWith("<") ? block : `<p>${block}</p>`)
      .join("");
  }

  async function loadPost() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    const response = await fetch(`https://raw.githubusercontent.com/${repo}/main/posts/${slug}.md`);
    const markdown = await response.text();

    const post = parsePost(markdown);
    const data = post.data;

    document.title = data.title || "Blog Post";

    document.getElementById("post").innerHTML = `
      <div class="post-date">${data.date ? new Date(data.date).toLocaleDateString("en-GB", { day: "2-digit", month: "long", year: "numeric" }) : ""}</div>
      <h1>${data.title}</h1>
      <img class="hero-image" src="${data.heroImage}" alt="${data.title}">
      <div class="excerpt">${data.excerpt}</div>
      <div class="content">${markdownToHtml(post.body)}</div>
    `;
  }

  loadPost();
</script>

</body>
</html>
